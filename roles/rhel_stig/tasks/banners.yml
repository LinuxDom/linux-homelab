---
- name: STIG Banner - Deploy SSH banner file
  template:
    src: stig_banner.j2
    dest: /etc/issue.net
    owner: root
    group: root
    mode: '0644'

- name: STIG Banner - Deploy local console banner
  template:
    src: stig_banner.j2
    dest: /etc/issue
    owner: root
    group: root
    mode: '0644'

- name: STIG Banner - Configure SSH to display banner
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Banner'
    line: 'Banner /etc/issue.net'
    state: present
  notify: Restart sshd
