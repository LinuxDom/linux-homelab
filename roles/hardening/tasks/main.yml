---
- name: Ensure all packages are updated
  dnf:
     name: "*"
     state: latest

- name: Install EPEL 10 repository
  dnf:
     name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
     state: present
     disable_gpg_check: yes

- name: Clean dnf cache after EPEL install
  command: dnf clean all

- name: Install fail2ban
  dnf:
     name: fail2ban
     state: present

- name: Enable and start firewalld
  service:
    name: firewalld
    state: started
    enabled: yes

- name: Enable and start fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes

- name: Allow SSH through firewall
  firewalld:
    service: ssh
    permanent: yes
    state: enabled
    immediate: yes

- name: Disable root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present

- name: Enforce key-based authentication only
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present

- name: Restart SSH to apply changes
  service:
    name: sshd
